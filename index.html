<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Azure DevOps Learning Hub</title>
  <style>
    :root {
      --cream:#f6efe4; --paper:#fffaf3; --ink:#2b2118; --brown:#6b4423;
      --orange:#b85d20; --line:#e4d5c3; --green:#49643f; --soft:#f3e2cf;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Iowan Old Style", serif; background:var(--cream); color:var(--ink); line-height:1.55; }
    header, main { max-width: 1040px; margin: 0 auto; padding: 20px; }
    header { padding-bottom: 4px; }
    h1,h2,h3 { font-weight: 600; line-height:1.2; }
    h1 { margin-bottom:6px; }
    nav { display:flex; flex-wrap:wrap; gap:8px; margin: 12px 0 22px; }
    button, textarea { font: inherit; border-radius: 10px; border: 1px solid var(--brown); padding: 10px 12px; }
    button { background: var(--brown); color: white; cursor: pointer; }
    button.ghost, button.active { background: transparent; color: var(--brown); }
    button.active { outline: 2px solid var(--orange); }
    .card, .node { background:var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 12px 0; }
    .grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
    .path-head { display:flex; gap:16px; align-items:flex-start; }
    .stop-number { flex:0 0 42px; height:42px; border-radius:50%; display:grid; place-items:center; background:var(--brown); color:white; font-weight:bold; }
    .path-head h2 { margin:0; }
    .location, .eyebrow { margin:2px 0; color:var(--green); font-weight:bold; font-size:.92rem; text-transform:uppercase; letter-spacing:.04em; }
    .action { border-left:4px solid var(--orange); background:#fff5e9; padding:10px 14px; }
    .check { background:var(--soft); border-radius:12px; padding:10px 14px; margin-top:12px; }
    .check summary { cursor:pointer; font-weight:bold; }
    .progress { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; align-items:center; background:var(--cream); border-bottom:1px solid var(--line); padding:10px 0; }
    .complete { border-color:#9bb28f; }
    .done-label { display:inline-flex; gap:8px; align-items:center; font-weight:bold; color:var(--green); }
    .done-label input { width:18px; height:18px; }
    .hidden { display:none; }
    a { color:var(--orange); text-underline-offset:2px; }
    .front { font-size: 1.4rem; min-height: 90px; }
    .answer { background:var(--soft); border-radius: 12px; padding: 12px; }
    .quiet { color:#64584e; }
    .source-links { font-size:.95rem; }
    @media (max-width:600px) {
      header, main { padding:14px; }
      .path-head { gap:10px; }
      .stop-number { flex-basis:34px; height:34px; }
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">PM fast path · local study page</p>
    <h1>Azure DevOps Learning Hub</h1>
    <p>Coordinate one fraud-detection release in one Azure DevOps project: plan the work, follow engineering, and land the release on time. No login required for this page.</p>
  </header>
  <main>
    <nav id="nav" aria-label="Learning hub sections"></nav>
    <section id="view" aria-live="polite"></section>
  </main>
  <script>
    const LINKS = {
      getStarted: "https://learn.microsoft.com/en-us/azure/devops/get-started/?view=azure-devops"
    };

    const PATH = [
      {
        place: "Program brief",
        title: "Know the delivery system",
        lesson: `<p><strong>Azure DevOps</strong> is a suite for planning, coding, building, testing, and packaging software; it is separate from the Azure cloud. In the Fraud Detection project, <strong>Boards</strong> holds the backlog, sprint, and reported dependency; <strong>Repos</strong> holds engineering’s work; <strong>Pipelines</strong> moves the release; <strong>Test Plans</strong> records the checks before stakeholder review; and <strong>Artifacts</strong> stores the package the release produces.</p><p><strong>Stakeholder</strong> access is a free, limited access level suited to people who mainly view and update work items. It is not a universal read-only role: features such as private-project Repos and Test Plans require higher access or licensing.</p>`,
        action: "Open the Fraud Detection project, identify which of the five service icons are enabled, and state what each contributes to this release.",
        question: "Which service holds a sprint backlog, and which service holds source code?",
        answer: "Boards holds the sprint backlog. Repos holds source code.",
        links: [
          ["What is Azure DevOps?", "https://learn.microsoft.com/en-us/azure/devops/user-guide/what-is-azure-devops?view=azure-devops"],
          ["Get started as a Stakeholder", "https://learn.microsoft.com/en-us/azure/devops/organizations/security/get-started-stakeholder?view=azure-devops"]
        ]
      },
      {
        place: "Project access",
        title: "Sign up or connect to a project",
        lesson: `<p>An <strong>organization</strong> contains projects; a <strong>project</strong> contains teams, work, repos, and pipelines. A new user might create an organization, accept an invitation, or switch directories and organizations before choosing a project.</p><p>Your PM task is usually to confirm the correct organization, project, and team—not to create duplicate spaces when a link seems missing.</p>`,
        action: "Write down the organization URL, Fraud Detection project name, delivery team name, and the person who can grant access. If you have access, open the project Summary page.",
        question: "You can sign in but cannot see the expected project. What four things should you verify first?",
        answer: "The account, Entra directory, organization, and whether you were added to the project or team.",
        links: [
          ["Sign up for Azure DevOps", "https://learn.microsoft.com/en-us/azure/devops/user-guide/sign-up-invite-teammates?view=azure-devops"],
          ["Connect to a project", "https://learn.microsoft.com/en-us/azure/devops/organizations/projects/connect-to-projects?view=azure-devops"]
        ]
      },
      {
        place: "Project setup",
        title: "Create the project and team",
        lesson: `<p>A project is the main boundary for work, code, and delivery settings. This learning path uses one Fraud Detection project and one delivery team so the backlog, board, sprint, repo, and release stay connected.</p><p>A <strong>Project Administrator</strong> runs one project. A <strong>Project Collection Administrator</strong> can govern every project and organization-level settings, so that role should be rare.</p>`,
        action: "In a sandbox—or on paper—define the Fraud Detection project’s visibility, process, delivery team, team administrator, and initial members.",
        question: "Who should add a new team and adjust its project settings: a project admin or a collection admin?",
        answer: "Normally a project admin. Collection admin is broader than needed.",
        links: [
          ["Manage a project", "https://learn.microsoft.com/en-us/azure/devops/organizations/projects/about-projects?view=azure-devops"],
          ["Create a project", "https://learn.microsoft.com/en-us/azure/devops/organizations/projects/create-project?view=azure-devops"],
          ["Add users to a project or team", "https://learn.microsoft.com/en-us/azure/devops/organizations/security/add-users-team-project?view=azure-devops"]
        ]
      },
      {
        place: "Access review",
        title: "Understand access, permissions, and billing",
        lesson: `<p><strong>Access levels</strong> decide which product features a person can use; <strong>permissions</strong> decide what that person can do in a specific scope. Readers can view a project, Contributors can change work and code, Project Administrators can configure one project, Build Administrators manage build resources, and Collection Administrators have organization-wide power. An explicit <strong>Deny</strong> usually blocks an inherited Allow.</p><p>Billing is attached to the organization’s Azure subscription and covers paid user access, parallel pipeline jobs, and services such as Artifacts storage. PMs should know the billing owner and request the least access that gets the work done.</p>`,
        action: "For the PM, engineer, stakeholder reviewer, and outside fraud specialist, write the minimum access level or group each needs. Distinguish who can change the plan from who can only read it.",
        question: "A user is in Contributors but still cannot push to a repo. What should you inspect?",
        answer: "Their access level, repo or branch permissions, inherited group membership, and any explicit Deny.",
        links: [
          ["Security and identity overview", "https://learn.microsoft.com/en-us/azure/devops/organizations/security/about-security-identity?view=azure-devops"],
          ["Default permissions and access", "https://learn.microsoft.com/en-us/azure/devops/organizations/security/permissions-access?view=azure-devops"],
          ["Set up billing", "https://learn.microsoft.com/en-us/azure/devops/organizations/billing/set-up-billing-for-your-organization-vs?view=azure-devops"]
        ]
      },
      {
        place: "Delivery plan",
        title: "Plan and track work",
        lesson: `<p>The <strong>backlog</strong> is the ordered demand for the fraud-detection initiative. A <strong>sprint</strong> is a time-box with selected work and capacity; the <strong>board</strong> visualizes flow through states. As PM, keep the detection outcome and acceptance criteria clear, ordering intentional, ownership visible, and the data-feed dependency linked.</p><p>Use queries, sprint views, and board columns to report status from live work—not a second hand-maintained status list.</p>`,
        action: "Create or draft a fraud-detection feature and three child stories. Add acceptance criteria, owners, effort, the external data-feed dependency, and assign the next-ready stories to a sprint.",
        question: "Where do you reorder future demand, plan a time-box, and inspect flow?",
        answer: "Backlog for demand, Sprints for the time-box, and Boards for flow.",
        links: [
          ["Plan and track work", "https://learn.microsoft.com/en-us/azure/devops/boards/get-started/plan-track-work?view=azure-devops"],
          ["Create a backlog", "https://learn.microsoft.com/en-us/azure/devops/boards/backlogs/create-your-backlog?view=azure-devops"],
          ["Define sprints", "https://learn.microsoft.com/en-us/azure/devops/boards/sprints/define-sprints?view=azure-devops"]
        ]
      },
      {
        place: "Engineering handoff",
        title: "Collaborate on code at PM altitude",
        lesson: `<p>A Git <strong>repo</strong> stores engineering’s code history. Engineers clone it locally, work on branches, push changes, and use pull requests for review. SSH is one authentication option; code search helps locate ownership or impact without downloading everything.</p><p>For the fraud release, know which repo and branch are involved, which pull request carries the detection change, what checks are pending, and which work item it delivers. Git permissions such as Read, Contribute, Create branch, and bypass policies can block or protect those actions.</p>`,
        action: "Open the fraud-detection repo and locate its default branch, release pull request, linked work item, reviewers, and required checks. Do not change code.",
        question: "What five identifiers help you discuss a code change with an engineer?",
        answer: "Project, repo, branch, pull request, and linked work item (plus its pipeline/check status).",
        links: [
          ["Create a repo", "https://learn.microsoft.com/en-us/azure/devops/repos/git/create-new-repo?view=azure-devops"],
          ["Clone a repo", "https://learn.microsoft.com/en-us/azure/devops/repos/git/clone?view=azure-devops"],
          ["Set Git permissions", "https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions?view=azure-devops"]
        ]
      },
      {
        place: "Release control",
        title: "Follow build and deployment",
        lesson: `<p>A pipeline automates build, test, and deployment steps. Its YAML file is the versioned pipeline definition; <strong>variables</strong> supply reusable values, while secrets need protected storage. Triggers and branch filters decide whether one or multiple branches build.</p><p>For the time-bound fraud release, follow the run, stage, approvals, environment, and linked commit or work item. A red run is evidence to investigate, not automatically a schedule status or a reason to rerun blindly. The successful release can publish a versioned package to Artifacts.</p>`,
        action: "Open the fraud release pipeline and identify its trigger, branch, stages, checks, Test Plans evidence, deployment environment, approver, and produced artifact.",
        question: "Where are pipeline steps described, and what controls which branches trigger a build?",
        answer: "Usually in a YAML file; trigger and branch-filter configuration controls the branches.",
        links: [
          ["Create your first pipeline", "https://learn.microsoft.com/en-us/azure/devops/pipelines/create-first-pipeline?view=azure-devops"],
          ["Build multiple branches", "https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/pipeline-options-for-git?view=azure-devops"],
          ["Pipeline variables", "https://learn.microsoft.com/en-us/azure/devops/pipelines/process/variables?view=azure-devops"]
        ]
      },
      {
        place: "Personal setup",
        title: "Tune preferences and notifications",
        lesson: `<p>Profile preferences cover items such as display, locale, time zone, and theme. Notifications can come from personal or team subscriptions, so tune them around assignments, mentions, changes, pull requests, and build failures instead of muting everything.</p><p>Favorites make frequently used projects, teams, backlogs, queries, repos, and pipelines easier to return to. Preview features exist, but they can change and might apply at user or organization scope.</p>`,
        action: "Confirm your time zone, favorite the team backlog and delivery dashboard, then keep one high-signal notification and remove one noisy subscription.",
        question: "Why should a PM check both personal and team notification subscriptions?",
        answer: "Either source can generate messages; changing only one may not stop noise or preserve needed alerts.",
        links: [
          ["Set your preferences", "https://learn.microsoft.com/en-us/azure/devops/organizations/settings/set-your-preferences?view=azure-devops"],
          ["Manage notifications", "https://learn.microsoft.com/en-us/azure/devops/organizations/notifications/manage-your-personal-notifications?view=azure-devops"]
        ]
      },
      {
        place: "Tool navigation",
        title: "Navigate without learning three tools",
        lesson: `<p>The <strong>web portal</strong> is the PM home for Boards, dashboards, project settings, repos, and pipeline status. <strong>Team Explorer</strong> is the older Visual Studio client experience engineers might mention; the <strong>CLI</strong> is useful for repeatable or scripted operations.</p><p>You only need to recognize the other doorways. Ask for a browser URL or recorded command when a status discussion starts in a tool you do not use.</p>`,
        action: "In the web portal, practice the route from organization to project to Boards, Repos, Pipelines, Project settings, and Organization settings.",
        question: "Which interface should be your default as a delivery PM?",
        answer: "The web portal. Recognize Team Explorer and CLI, but use them only when the task calls for them.",
        links: [
          ["Web portal navigation", "https://learn.microsoft.com/en-us/azure/devops/project/navigation/?view=azure-devops"],
          ["Azure DevOps CLI", "https://learn.microsoft.com/en-us/azure/devops/cli/?view=azure-devops"]
        ]
      },
      {
        place: "Incident triage",
        title: "Triage before escalating",
        lesson: `<p>Put problems into one of three buckets: <strong>connection/access</strong> (account, directory, organization, project), <strong>permissions</strong> (access level, group, scope, inheritance, Deny), or <strong>pipelines</strong> (run logs, agent, service connection, variable, approval, environment).</p><p>Capture the URL, exact error, user, time, scope, and run or correlation ID before escalating. That gives an administrator or engineer a reproducible starting point.</p>`,
        action: "Make a reusable incident note with fields for expected result, actual result, exact error, URL, identity, project/repo/pipeline, timestamp, run ID, and screenshot.",
        question: "What is the fastest useful first split for an Azure DevOps problem?",
        answer: "Connection/access, permissions, or pipelines—then collect the identifiers and exact error.",
        links: [
          ["Troubleshoot connection and access", "https://learn.microsoft.com/en-us/azure/devops/organizations/projects/tf31002-unable-connect-tfs?view=azure-devops"],
          ["Troubleshoot permissions", "https://learn.microsoft.com/en-us/azure/devops/organizations/security/troubleshoot-permissions?view=azure-devops"],
          ["Troubleshoot pipelines", "https://learn.microsoft.com/en-us/azure/devops/pipelines/troubleshooting/troubleshooting?view=azure-devops"]
        ],
        note: `TFS/Azure DevOps Server migration exists, but it is out of scope for this fast path. <a href="https://learn.microsoft.com/en-us/azure/devops/migrate/migration-overview?view=azure-devops" target="_blank" rel="noopener">See the official migration overview</a> if it becomes relevant.`
      }
    ];

    const TERMS = [
      ["ADO", "Azure DevOps", "Microsoft's suite for planning, storing, building, testing, and shipping software."],
      ["Azure", "Azure cloud", "Microsoft’s cloud computing platform. Azure DevOps can deploy onto Azure, but they are different products."],
      ["Boards", "Azure Boards", "Backlogs, sprints, boards, bugs, dependencies, and delivery status."],
      ["Repos", "Azure Repos", "Git source history, branches, pull requests, and reviewed changes."],
      ["Pipelines", "Azure Pipelines", "Automated build, test, approval, and deployment steps for a release."],
      ["Test Plans", "Azure Test Plans", "Formal test cases, execution, and results connected to requirements."],
      ["Artifacts", "Azure Artifacts", "Versioned packages such as NuGet or npm outputs, stored for reuse or release."],
      ["Stakeholder", "Stakeholder access", "A free, limited access level for people who mainly view and update work items."],
      ["CI", "Continuous Integration", "Every change is built and tested quickly so integration problems surface early."],
      ["CD", "Continuous Delivery or Deployment", "Delivery keeps a release ready for approval; deployment can ship automatically."],
      ["PR", "Pull request", "A proposed code change. Review and automated checks happen before it joins the main branch."],
      ["YAML", "YAML Ain't Markup Language", "The plain-text format commonly used to define pipeline steps and settings."],
      ["Entra ID", "Microsoft Entra ID", "The company identity system, formerly Azure Active Directory."],
      ["RBAC", "Role-based access control", "Access follows a role and scope: the cashier key does not open every door."],
      ["PAT", "Personal access token", "A revocable credential for tools or scripts. Scope it tightly and expire it."],
      ["TFS", "Team Foundation Server", "The older on-premises product lineage, now Azure DevOps Server."]
    ];

    const SCENARIOS = [
      ["A sponsor asks where the fraud release stands.", "Use the current sprint and board: completed versus committed work, the data-feed dependency, blocked items, pipeline status, test evidence, and forecast release date."],
      ["The fraud-data dependency threatens the sprint goal.", "Link the items, name the owner, record the needed-by date and release impact, agree the next action, and surface it in sprint status."],
      ["The release pull request is still open. What do you ask?", "Which work item does it deliver, who must review it, which policy or check is pending, and does it threaten the release pipeline start?"],
      ["Someone says the pipeline failed. What do you ask?", "Which fraud-release pipeline, run, branch, stage, and error? Was it build, test, approval, service connection, agent, or deployment?"],
      ["What happens before stakeholders see the release?", "Required engineering checks pass, Test Plans evidence is recorded, the pipeline reaches the correct environment, and the designated approval is complete."],
      ["Boards or Repos: where is the backlog?", "Boards holds the backlog and sprint. Repos holds engineering’s source code and pull requests."],
      ["An outside fraud specialist needs to review but not change the plan.", "Give the minimum access level and project-scoped read permissions needed, avoid collection-wide roles, and set a review date."],
      ["A user is a Contributor but cannot push.", "Check access level, repository and branch scope, inherited groups, branch policies, and any explicit Deny."],
      ["How is a sprint different from the fraud-release milestone?", "A sprint is a short planning and delivery time-box. The release milestone is the broader promised event; several sprints may contribute to it."],
      ["Which interface should a PM learn first?", "The web portal. Recognize Team Explorer and CLI so you can follow engineers, but do not turn either into a separate course."]
    ];

    const DELIVERY_DESK = [
      ["Plan", "Boards", "Fraud-release backlog, sprint commitment, blockers, dependency, and status."],
      ["Engineering change", "Repos", "Branch, pull request, reviewers, checks, and linked work item."],
      ["Release", "Pipelines", "Build, test, approvals, environments, and deployment status."],
      ["Readiness", "Test Plans", "Requirements connected to formal tests and stakeholder-ready results."],
      ["Output", "Artifacts", "The versioned package produced for the release."],
      ["Control", "Permissions", "Who can change the plan, code, or release—and who can only read it."]
    ];

    const VIEWS = ["Fast path", "Delivery desk", "Glossary", "Cards", "Scenarios", "Official docs"];
    const view = document.getElementById("view");
    const nav = document.getElementById("nav");
    let cardIndex = 0;
    let scenarioIndex = 0;

    function completedStops() {
      try { return JSON.parse(localStorage.getItem("ado-path-complete") || "[]"); }
      catch { return []; }
    }

    function show(name) {
      [...nav.children].forEach(button => button.classList.toggle("active", button.dataset.view === name));
      if (name === "Fast path") renderPath();
      if (name === "Delivery desk") view.innerHTML = deliveryDesk();
      if (name === "Glossary") view.innerHTML = glossary();
      if (name === "Cards") renderCard();
      if (name === "Scenarios") renderScenario();
      if (name === "Official docs") view.innerHTML = resources();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderPath() {
      const done = completedStops();
      const cards = PATH.map((stop, index) => {
        const links = stop.links.map(([label, url]) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`).join(" · ");
        return `<article class="card ${done.includes(index) ? "complete" : ""}" id="stop-${index + 1}">
          <div class="path-head">
            <span class="stop-number">${index + 1}</span>
            <div><p class="location">${stop.place}</p><h2>${stop.title}</h2></div>
          </div>
          ${stop.lesson}
          <p class="action"><strong>Do this:</strong> ${stop.action}</p>
          <details class="check"><summary>Check: ${stop.question}</summary><p>${stop.answer}</p></details>
          <p class="source-links"><strong>Official guide:</strong> ${links}</p>
          ${stop.note ? `<p class="quiet">${stop.note}</p>` : ""}
          <label class="done-label"><input class="stop-check" type="checkbox" data-stop="${index}" ${done.includes(index) ? "checked" : ""}> Mark stop complete</label>
        </article>`;
      }).join("");
      view.innerHTML = `<div class="progress"><strong><span id="done-count">${done.length}</span> of ${PATH.length} stops complete</strong><button id="reset-path" class="ghost" type="button">Reset progress</button></div>
        <article class="card"><h2>Your expedited route</h2><p>Complete the stops in order over a few sittings. Each one gives you the PM-level idea, one action, one recall check, and the official Microsoft guide for deeper detail.</p></article>${cards}`;
      document.querySelectorAll(".stop-check").forEach(box => {
        box.onchange = () => {
          const values = completedStops().filter(value => value !== Number(box.dataset.stop));
          if (box.checked) values.push(Number(box.dataset.stop));
          localStorage.setItem("ado-path-complete", JSON.stringify(values.sort((a,b) => a - b)));
          renderPath();
          document.getElementById(`stop-${Number(box.dataset.stop) + 1}`).scrollIntoView();
        };
      });
      document.getElementById("reset-path").onclick = () => {
        localStorage.removeItem("ado-path-complete");
        renderPath();
      };
    }

    function deliveryDesk() {
      const nodes = DELIVERY_DESK.map(([step, service, line]) => `<article class="node"><p class="location">${step}</p><h3>${service}</h3><p>${line}</p></article>`).join("");
      return `<article class="card"><h2>One initiative. One project. One connected status.</h2><p>The Fraud Detection project connects the delivery plan to engineering’s change, test evidence, release progress, and final package. The PM follows that chain without doing the developer’s job.</p></article><div class="grid">${nodes}</div>`;
    }

    function glossary() {
      return TERMS.map(([short, full, meaning]) => `<details class="card"><summary><strong>${short}</strong> — ${full}</summary><p>${meaning}</p></details>`).join("");
    }

    function renderCard() {
      const [short, full, meaning] = TERMS[cardIndex];
      const due = Number(localStorage.getItem("ado-card-due") || 0);
      view.innerHTML = `<article class="card"><p>Card ${cardIndex + 1} of ${TERMS.length}. Next review marker: ${due ? new Date(due).toLocaleString() : "not set"}.</p><p class="front">${short}</p><div id="card-answer" class="hidden answer"><p><strong>${full}</strong></p><p>${meaning}</p></div><p><button id="reveal" type="button">Show answer</button> <button id="again" class="ghost" type="button">Again tomorrow</button> <button id="next-card" class="ghost" type="button">Next</button></p></article>`;
      document.getElementById("reveal").onclick = () => document.getElementById("card-answer").classList.remove("hidden");
      document.getElementById("again").onclick = () => { localStorage.setItem("ado-card-due", String(Date.now() + 86400000)); cardIndex = (cardIndex + 1) % TERMS.length; renderCard(); };
      document.getElementById("next-card").onclick = () => { cardIndex = (cardIndex + 1) % TERMS.length; renderCard(); };
    }

    function renderScenario() {
      const [question, answer] = SCENARIOS[scenarioIndex];
      view.innerHTML = `<article class="card"><p>Scenario ${scenarioIndex + 1} of ${SCENARIOS.length}</p><h3>${question}</h3><textarea id="say" rows="4" style="width:100%" placeholder="Say it in your own words"></textarea><p><button id="show-say" type="button">Compare</button> <button id="next-say" class="ghost" type="button">Next</button></p><div id="model" class="hidden answer"><p>${answer}</p></div></article>`;
      document.getElementById("show-say").onclick = () => document.getElementById("model").classList.remove("hidden");
      document.getElementById("next-say").onclick = () => { scenarioIndex = (scenarioIndex + 1) % SCENARIOS.length; renderScenario(); };
    }

    function resources() {
      return `<article class="card"><h2>Microsoft is the source of truth</h2><p><a href="${LINKS.getStarted}" target="_blank" rel="noopener">Open the Azure DevOps get-started documentation</a> for the complete official index. Every fast-path stop also links directly to its relevant Microsoft guides.</p><p>This page shortens and sequences the PM learning route; it does not replace product documentation.</p></article>`;
    }

    VIEWS.forEach(name => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "ghost";
      button.dataset.view = name;
      button.textContent = name;
      button.onclick = () => show(name);
      nav.appendChild(button);
    });
    show("Fast path");
  </script>
</body>
</html>
